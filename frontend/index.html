<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- App Meta -->
    <title>SmartFit - Video Insights & AI Wardrobe</title>
    <meta name="description" content="Extract value from TikTok, Reels & Shorts. AI-powered wardrobe tracking and outfit suggestions." />
    <meta name="keywords" content="video insights, tiktok, reels, shorts, wardrobe, outfit, AI, fashion" />
    <meta name="author" content="SmartFit" />

    <!-- Theme & Colors -->
    <meta name="theme-color" content="#9333ea" />
    <meta name="msapplication-navbutton-color" content="#9333ea" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Mobile App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SmartFit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SmartFit" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%239333ea'/><stop offset='100%25' stop-color='%23ec4899'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23g)'/><path d='M30 35 L50 25 L70 35 L70 65 L50 75 L30 65 Z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/><circle cx='50' cy='50' r='10' fill='white'/></svg>" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%239333ea'/><path d='M30 35 L50 25 L70 35 L70 65 L50 75 L30 65 Z' fill='none' stroke='white' stroke-width='4'/><circle cx='50' cy='50' r='10' fill='white'/></svg>" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://api.openai.com" />

    <!-- Base Styles for Loading State -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #f5f3ff 0%, #fdf2f8 100%);
        overflow-x: hidden;
      }

      #root {
        min-height: 100%;
      }

      /* iOS Safe Area Support */
      .safe-top {
        padding-top: env(safe-area-inset-top);
      }

      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Loading Screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #9333ea 0%, #ec4899 50%, #06b6d4 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loading-logo {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        animation: pulse 2s ease-in-out infinite;
        backdrop-filter: blur(10px);
      }

      .loading-logo svg {
        width: 48px;
        height: 48px;
      }

      .loading-text {
        color: white;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }

      .loading-subtitle {
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        font-weight: 500;
      }

      .loading-bar {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        margin-top: 32px;
        overflow: hidden;
      }

      .loading-bar-inner {
        height: 100%;
        background: white;
        border-radius: 4px;
        animation: loading 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      @keyframes loading {
        0% { width: 0%; margin-left: 0; }
        50% { width: 60%; margin-left: 20%; }
        100% { width: 0%; margin-left: 100%; }
      }

      /* Smooth Scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Selection Color */
      ::selection {
        background: #9333ea;
        color: white;
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }

      /* Prevent Pull-to-Refresh on Mobile */
      body {
        overscroll-behavior-y: contain;
      }

      /* Hide Loading Screen Once App Loads */
      .app-loaded #loading-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
      </div>
      <div class="loading-text">SmartFit</div>
      <div class="loading-subtitle">Video Insights & AI Wardrobe</div>
      <div class="loading-bar">
        <div class="loading-bar-inner"></div>
      </div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>

    <!-- App Entry Point -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide Loading Screen After App Mounts -->
    <script>
      // Hide loading screen once React app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
          }
          document.body.classList.add('app-loaded');
        }, 500);
      });

      // Service Worker Registration (for PWA)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {
            // Service worker registration failed, app still works
          });
        });
      }
    </script>

    <!-- Prevent FOUC -->
    <noscript>
      <style>
        #loading-screen { display: none !important; }
      </style>
      <div style="padding: 40px; text-align: center; font-family: system-ui, sans-serif;">
        <h1>SmartFit</h1>
        <p>Please enable JavaScript to use this application.</p>
      </div>
    </noscript>
  </body>
</html>
